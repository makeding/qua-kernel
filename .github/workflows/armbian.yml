name: quastation armbian Debian 13 release

on:
  workflow_dispatch:
    inputs:
      kernel_tag:
        description: Existing kernel Release tag to attach Armbian assets to
        required: true
        type: string

permissions:
  contents: read

jobs:
  rootfs:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          repository: armbian/build
          ref: 1ce67c25929fc5b0c4b51d4c051ed7d7e156e8fd
      - name: Restore Armbian rootfs cache
        id: rootfs-cache
        uses: actions/cache/restore@v4
        with:
          path: cache/rootfs
          key: armbian-rootfs-trixie-arm64-minimal-1ce67c25929fc5b0c4b51d4c051ed7d7e156e8fd-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: armbian-rootfs-trixie-arm64-minimal-1ce67c25929fc5b0c4b51d4c051ed7d7e156e8fd-
      - name: Build official Armbian Trixie arm64 rootfs
        run: sudo ./compile.sh rootfs RELEASE=trixie ARCH=arm64 BUILD_MINIMAL=yes BUILD_DESKTOP=no
      - name: Save Armbian rootfs cache
        uses: actions/cache/save@v4
        with:
          path: cache/rootfs
          key: ${{ steps.rootfs-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: armbian-base-${{ github.run_id }}
          path: cache/rootfs/*.tar.zst
          if-no-files-found: error
          retention-days: 7

  assemble:
    needs: rootfs
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      KERNEL_TAG: ${{ inputs.kernel_tag }}
      CCACHE_DIR: ${{ github.workspace }}/build/ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v4
      - name: Restore media compiler cache
        id: compiler-cache
        uses: actions/cache/restore@v4
        with:
          path: build/ccache
          key: media-ccache-trixie-arm64-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: media-ccache-trixie-arm64-v1-
      - name: Install native build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates ccache curl git gh kmod patch python3 xz-utils zstd zlib1g-dev libegl-dev libgles-dev libdrm-dev
      - uses: actions/download-artifact@v4
        with:
          name: armbian-base-${{ github.run_id }}
          path: build/armbian-base
      - name: Download matching kernel and media inputs
        run: |
          mkdir -p build/kernel build/release
          gh release download "$KERNEL_TAG" --pattern 'linux-image-*_arm64.deb' --dir build/kernel
          curl -fL https://ffmpeg.org/releases/ffmpeg-4.4.5.tar.xz -o build/ffmpeg-4.4.5.tar.xz
          bash media/vendor-openmax/fetch-libraries.sh
      - name: Build media runtime
        run: make armbian-media CC="ccache cc" FFMPEG_ARCHIVE="$GITHUB_WORKSPACE/build/ffmpeg-4.4.5.tar.xz"
      - name: Assemble Qua Armbian rootfs
        run: |
          set -- build/armbian-base/*.tar.zst
          test "$#" -eq 1
          base=$1
          set -- build/kernel/*.deb
          test "$#" -eq 1
          make armbian-rootfs ARMBIAN_ROOTFS="$base" KERNEL_DEB="$1"
      - name: Prepare release assets
        run: |
          cp build/armbian/QuaStation-Armbian-trixie-arm64-rootfs.tar.zst build/release/
          cp README.md build/release/INSTALL.ja.md
          tar -czf build/release/QuaStation-install-tools.tar.gz image
          cd build/release
          sha256sum *.tar.zst *.tar.gz INSTALL.ja.md > SHA256SUMS-armbian
      - uses: actions/upload-artifact@v4
        with:
          name: qua-armbian-${{ github.run_id }}
          path: build/release/*
          if-no-files-found: error
          retention-days: 14
      - name: Attach Armbian assets to kernel Release
        run: gh release upload "$KERNEL_TAG" build/release/*
      - name: Save media compiler cache (including failed builds)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: build/ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
